studies:
  - number: "论文 01"
    title: "面向低碳改造策略优选的情境自适应全生命周期可行性框架"
    question: "如何使改造策略在异质化老旧居住社区中仍然具备可解释性与适应性？"
    image: "/media/portfolio/paper-retrofit-viability.webp"
    image_alt: "改造可行性框架的图文摘要"
    highlights:
      - "针对216类社区原型评估690,795种改造组合"
      - "利用SHAP识别不同建成年代下关键改造驱动因素的变化"
      - "通过情境自适应权重综合能源、碳排放、光伏与全生命周期成本"
      - "改造后能耗更低并不必然意味着全生命周期可行性更高"
    url: "/publications/aged-residential-retrofit/"
  - number: "论文 02"
    title: "可靠改造决策究竟需要多少信息？"
    question: "应当优先采集哪些建筑信息，以及多少信息足以支撑稳定决策？"
    image: "/media/portfolio/paper-information-uncertainty.webp"
    image_alt: "考虑不确定性的改造决策框架图文摘要"
    highlights:
      - "建筑信息不确定性会传播至能源、舒适度、碳排放与成本结果"
      - "利用深度学习提取立面特征并量化窗墙比估算误差"
      - "在八栋差异显著的居住建筑中检验统一工作流程"
      - "通过全信息遗憾值识别信息优先级与最低信息要求"
    url: "/publications/information-uncertainty-retrofit/"

