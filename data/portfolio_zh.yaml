doctoral_research:
  label: "博士研究课题"
  title: "既有居住社区低碳改造策略与光储直柔系统应用研究"
  summary: >-
    本研究构建一个系统层级框架，贯通社区特征刻画、改造性能建模、光储直柔潜力评估、
    考虑不确定性的优化、生成式设计与实证验证。其目标是以透明、情境自适应的路径，
    取代面向异质社区的“一刀切”改造决策。
  image: "/media/portfolio/doctoral-research-framework.webp"
  image_alt: "马弋关于低碳改造与光储直柔系统的博士研究框架"
  stages:
    - number: "01"
      title: "社区原型"
      text: "通过参数化社区模型表征热工、几何、空间及清洁能源特征。"
    - number: "02"
      title: "机理分析"
      text: "量化被动、主动和可再生能源措施的单项贡献及耦合效应。"
    - number: "03"
      title: "光储直柔潜力"
      text: "评估光伏资源、储能需求、直流配电适用性、柔性负荷与空间约束。"
    - number: "04"
      title: "多目标优化"
      text: "在不确定条件下平衡能源、碳排放、可再生能源利用、舒适度与全生命周期成本。"
    - number: "05"
      title: "生成式设计"
      text: "将帕累托解转化为可解释、情境特定的改造方案与决策支持。"
    - number: "06"
      title: "实证验证"
      text: "利用真实案例校准模型、检验稳健性，并提炼可迁移的工程建议。"
  methods:
    - "EnergyPlus · TRNSYS · MATLAB/Simulink"
    - "Rhino · Grasshopper · Ladybug Tools"
    - "Python · 代理模型 · SHAP"
    - "NSGA-III · 敏感性与不确定性分析"

projects:
  - number: "01"
    slug: "integrated-pv-storage-pathways"
    title: "天津市光储直柔建筑发展战略评估"
    period: "2023年4月—2024年9月"
    organisation: "中国工程院战略研究与咨询项目"
    type: "工程战略 · 利益相关者调研"
    problem: >-
      区域规模化应用并不只取决于单项技术。本项目将供应链、建筑条件、电网友好性、
      标准体系、市场成熟度与政策环境等分散证据整合为系统判断。
    contribution: >-
      构建利益相关者调研框架，综合政策与工程资料，并作为主要撰稿人完成天津市发展基础与战略机遇相关章节。
    image: "/media/portfolio/pedf-stakeholder-research.webp"
    image_alt: "光储直柔战略项目的利益相关者调研会议"
    image_class: "pf-project-image-bottom-row"
  - number: "02"
    slug: "tianjin-university-energy-audit"
    title: "天津大学校园能源审计与改造评估"
    period: "2023年12月—2024年7月"
    organisation: "天津大学 · 天津市发展和改革委员会"
    type: "监管型审计 · 改造可行性评估"
    problem: >-
      本次审计将账单、计量记录、建筑清单、设备参数与管理文件转化为两个校区可追溯的能源基线，
      并形成可实施的节能改造情景。
    contribution: >-
      负责五人团队管理，建立校级能源核算框架，并评估拟议措施的节能量、减碳量、投资、
      年度收益、回收期、净现值和内部收益率。
    image: "/media/portfolio/energy-audit-uav.webp"
    image_alt: "天津大学能源审计中的无人机现场调研"
  - number: "03"
    slug: "zero-carbon-campus-retrofit"
    title: "既有校园零碳化改造"
    period: "2023年6月—2025年4月"
    organisation: "天津大学 · 中国长江电力 · 三峡电能"
    type: "产学研研发 · 示范方案"
    problem: >-
      本项目将需求侧节能、光伏、建筑光伏一体化、光伏光热、热泵、储能、直流配电、
      柔性用能及环境管理整合为可迁移的校园改造路径。
    contribution: >-
      撰写并统筹技术报告，形成水资源与固体废弃物管理的实施内容，
      并围绕光储协同和碳能优化概念开展专利检索与布局分析。

