studies:
  - number: "Paper 01"
    title: "A Context-Adaptive Whole-Life Viability Framework for Prioritising Low-Carbon Retrofit Strategies"
    question: "How can retrofit strategies remain interpretable and adaptable across heterogeneous aged residential communities?"
    image: "/media/portfolio/paper-retrofit-viability.webp"
    image_alt: "Graphical abstract for the retrofit viability framework"
    highlights:
      - "690,795 retrofit combinations evaluated across 216 community archetypes"
      - "SHAP identifies construction-period shifts in key retrofit drivers"
      - "Context-adaptive weighting integrates energy, carbon, PV, and life-cycle cost"
      - "Lower post-retrofit energy use does not necessarily mean higher whole-life viability"
    url: "/publications/aged-residential-retrofit/"
  - number: "Paper 02"
    title: "How Much Information Is Enough for Reliable Retrofit Decisions"
    question: "Which building information should be acquired first, and how much is sufficient for a stable decision?"
    image: "/media/portfolio/paper-information-uncertainty.webp"
    image_alt: "Graphical abstract for the uncertainty-aware retrofit decision framework"
    highlights:
      - "Building-information uncertainty propagates to energy, comfort, carbon, and cost"
      - "Deep learning extracts facade features and quantifies WWR estimation error"
      - "A common workflow is tested across eight contrasting residential buildings"
      - "Full-information regret reveals information priorities and minimum requirements"
    url: "/publications/information-uncertainty-retrofit/"

