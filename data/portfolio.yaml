doctoral_research:
  label: "Doctoral research programme"
  title: "Low-Carbon Retrofit Strategies and Integrated PV-Storage Applications for Aged Residential Communities"
  summary: >-
    The research develops a system-level framework that connects community
    characterisation, retrofit-performance modelling, PEDF potential assessment,
    uncertainty-aware optimisation, generative design, and empirical validation.
    The objective is to replace one-size-fits-all retrofit decisions with
    transparent, context-adaptive pathways for heterogeneous communities.
  image: "/media/portfolio/doctoral-research-framework.webp"
  image_alt: "Framework of Yi Ma's doctoral research on low-carbon retrofit and PEDF systems"
  stages:
    - number: "01"
      title: "Community archetypes"
      text: "Represent thermal, geometric, spatial, and clean-energy characteristics through parameterised community models."
    - number: "02"
      title: "Mechanism analysis"
      text: "Quantify individual contributions and coupled effects of passive, active, and renewable-energy measures."
    - number: "03"
      title: "PEDF potential"
      text: "Assess PV resources, storage needs, DC-distribution suitability, flexible loads, and spatial constraints."
    - number: "04"
      title: "Multi-objective optimisation"
      text: "Balance energy, carbon, renewable utilisation, comfort, and whole-life cost under uncertainty."
    - number: "05"
      title: "Generative design"
      text: "Translate Pareto solutions into explainable, context-specific retrofit schemes and decision support."
    - number: "06"
      title: "Empirical validation"
      text: "Calibrate models with real cases, test robustness, and derive transferable engineering recommendations."
  methods:
    - "EnergyPlus · TRNSYS · MATLAB/Simulink"
    - "Rhino · Grasshopper · Ladybug Tools"
    - "Python · surrogate models · SHAP"
    - "NSGA-III · sensitivity and uncertainty analysis"

projects:
  - number: "01"
    slug: "integrated-pv-storage-pathways"
    title: "Strategic Assessment of PEDF Building Development in Tianjin"
    period: "Apr 2023 - Sep 2024"
    organisation: "Strategic Research and Consulting Project of the Chinese Academy of Engineering"
    type: "Engineering strategy · stakeholder research"
    problem: >-
      Regional deployment depends on more than individual technologies. The
      project connected fragmented evidence on supply chains, building
      conditions, grid interaction, standards, market readiness, and policy.
    contribution: >-
      Developed the stakeholder survey framework, synthesised evidence from
      policy and engineering sources, and served as a principal drafter of the
      chapter on Tianjin's foundations and strategic opportunities.
    image: "/media/portfolio/pedf-stakeholder-research.webp"
    image_alt: "Stakeholder research meeting for the PEDF strategy project"
    image_class: "pf-project-image-bottom-row"
  - number: "02"
    slug: "tianjin-university-energy-audit"
    title: "Campus-Scale Energy Audit and Retrofit Assessment"
    period: "Dec 2023 - Jul 2024"
    organisation: "Tianjin University · Tianjin Municipal Development and Reform Commission"
    type: "Regulatory audit · retrofit feasibility"
    problem: >-
      The audit transformed bills, metering records, building inventories,
      equipment parameters, and management documents into a traceable baseline
      for two campuses and a set of implementable retrofit scenarios.
    contribution: >-
      Led a five-member team, built the campus energy-accounting framework, and
      assessed energy savings, carbon reductions, investment, annual savings,
      payback, NPV, and IRR for proposed measures.
    image: "/media/portfolio/energy-audit-uav.webp"
    image_alt: "UAV fieldwork during the Tianjin University energy audit"
  - number: "03"
    slug: "zero-carbon-campus-retrofit"
    title: "Zero-Carbon Retrofit of Existing Campuses"
    period: "Jun 2023 - Apr 2025"
    organisation: "Tianjin University · China Yangtze Power · Three Gorges Electric Energy"
    type: "Industry-linked R&D · demonstration planning"
    problem: >-
      The project organised demand reduction, photovoltaics, BIPV, PVT, heat
      pumps, storage, DC distribution, flexible demand, and environmental
      management into a transferable campus retrofit pathway.
    contribution: >-
      Drafted and integrated technical reports, developed implementation content
      for water and solid-waste management, and conducted patent landscaping for
      PV-storage coordination and carbon-energy optimisation concepts.

