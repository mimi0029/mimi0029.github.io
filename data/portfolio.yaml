profile:
  label: "Research profile"
  title: "From environmental engineering to deployable energy intelligence"
  paragraphs:
    - >-
      My academic route spans environmental engineering, architecture, and
      sustainable energy. This interdisciplinary training lets me examine an
      energy system from its physical boundary and data quality through to its
      operational, economic, and life-cycle consequences.
    - >-
      My current work focuses on transparent and transferable methods for
      integrated PV-storage systems, source-storage-load coordination, demand
      response, and grid-interactive low-carbon applications. I am particularly
      interested in work that combines modelling with measured data,
      demonstration platforms, and practical deployment constraints.
  trajectory:
    - period: "2016-2020"
      degree: "B.Eng. Environmental Engineering"
      institution: "Nanjing Agricultural University"
    - period: "2020-2023"
      degree: "M.Eng. Environmental Engineering"
      institution: "Nankai University"
    - period: "2023-Present"
      degree: "Ph.D. Candidate in Architecture"
      institution: "Tianjin University · APEC Sustainable Energy Center"

